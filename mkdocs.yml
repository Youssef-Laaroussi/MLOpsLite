site_name: MLite Documentation
site_description: Lightweight Self-Hosted MLOps Platform
site_author: Youssef Laaroussi
repo_url: https://github.com/Youssef-Laaroussi/MLOpsLite
repo_name: Youssef-Laaroussi/MLOpsLite
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Getting Started:
      - Prerequisites: getting-started/prerequisites.md
      - Installation: getting-started/installation.md
      - 5-Min Quickstart: getting-started/quickstart.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Tutorials & Examples:
      - Iris Starter: ../examples/iris/README.md
      - Fraud Detection & Rollback: tutorials/fraud_detection.md
      - Demand Forecasting: tutorials/demand_forecasting.md
  - Reliability & Rollback:
      - Controlled Rollback: reliability/rollback.md
      - Auto-Rollback Policies: reliability/auto_rollback_policies.md
  - Security & Governance:
      - Authentication & Keys: security/authentication.md
      - Role-Based Access Control: security/rbac.md
      - Audit Logging: security/audit_logging.md
  - Monitoring & Alerting:
      - Drift Detection: monitoring/drift_detection.md
      - Data Quality: monitoring/data_quality.md
      - Evidently AI: monitoring/evidently_integration.md
      - Performance Monitoring: monitoring/performance_monitoring.md
      - Notifications: alerting/notifications.md
  - CLI Reference:
      - Overview: cli/overview.md
      - Commands Reference: cli/commands.md
      - Autocompletion: cli/autocompletion.md
  - REST API:
      - Overview: api/overview.md
      - Endpoints: api/endpoints.md
      - Error Handling: api/errors.md
  - Contributing & Quality:
      - Unit Testing: contributing/testing.md
      - Integration Testing: contributing/integration_tests.md
      - E2E Lifecycle Testing: contributing/e2e_testing.md
      - CI/CD Pipelines: contributing/ci_cd.md
