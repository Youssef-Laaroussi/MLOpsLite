name: ✨ Feature Request
description: Suggest an idea or enhancement for MLite
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! MLite aims to be simple, self-hosted, and lightweight.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've thought about.
  - type: dropdown
    id: alignment
    attributes:
      label: Does this align with MLite's principles?
      description: MLite focuses on self-hosted, lightweight, non-Kubernetes setups for small teams.
      options:
        - "Yes, it keeps things simple and self-hosted"
        - "It adds an optional extension / plugin"
        - "Not sure, open to discussion"
    validations:
      required: true
